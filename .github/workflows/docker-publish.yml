
name: Build, Publish and Deploy

on:
  push:
    branches:
      - review-3

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Получаем исходный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Настраиваем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизуемся в GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем и публикуем backend
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/zaytcev-net/film-backend:latest

      # Собираем и публикуем frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/zaytcev-net/film-frontend:latest
          build-args: |
            VITE_API_URL=https://api.zaytcev-net.nomorepartiessite.ru/api/afisha
            VITE_CDN_URL=https://api.zaytcev-net.nomorepartiessite.ru/content/afisha

      # Собираем и публикуем nginx
      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/zaytcev-net/film-server:latest

  # Автоматический деплой на сервер
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts

          ACTUAL_FINGERPRINT=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR == 1 {print $2}')

          if [ "$ACTUAL_FINGERPRINT" != "SHA256:iSUDjQ0fl6SE/2ywVKKi/cOxL72BJZIM2OSFgvDARmM" ]; then
            echo "SSH fingerprint verification failed!"
            exit 1
          fi

      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/film-react-nest && docker compose --env-file .env.prod -f docker-compose.prod.yml pull && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d'
