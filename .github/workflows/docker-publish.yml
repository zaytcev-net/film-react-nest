name: Build and Publish Docker Images

on:
  push:
    branches:
      - review-3

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Получаем исходный код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Настраиваем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизуемся в GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем и публикуем backend
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/zaytcev-net/film-backend:latest

      # Собираем и публикуем frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/zaytcev-net/film-frontend:latest
          build-args: |
            VITE_API_URL=http://api.zaytcev-net.nomorepartiessite.ru/api/afisha
            VITE_CDN_URL=http://api.zaytcev-net.nomorepartiessite.ru/content/afisha

      # Собираем и публикуем nginx
      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/zaytcev-net/film-server:latest
