services:
  # PostgreSQL
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS backend
  backend:
    image: ghcr.io/zaytcev-net/film-backend:latest
    restart: unless-stopped
    pull_policy: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_PORT: ${DATABASE_PORT}
      LOGGER_TYPE: ${LOGGER_TYPE:-json}
    depends_on:
      database:
        condition: service_healthy

  # React frontend
  frontend:
    image: ghcr.io/zaytcev-net/film-frontend:latest
    restart: "no"
    pull_policy: always
    volumes:
      - frontend_data:/frontend

  # Nginx
  server:
    image: ghcr.io/zaytcev-net/film-server:latest
    restart: unless-stopped
    pull_policy: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_data:/usr/share/nginx/html:ro
      - certbot_data:/var/www/certbot:ro
      - letsencrypt_data:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started

  # Let's Encrypt Certbot
  certbot:
    image: certbot/certbot:latest
    restart: "no"
    profiles:
      - tools
    volumes:
      - certbot_data:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  frontend_data:
  certbot_data:
  letsencrypt_data:
