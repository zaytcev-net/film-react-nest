
# HTTP: фронтенд
server {
    listen 80;
    server_name film.zaytcev-net.nomorepartiessite.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP: API
server {
    listen 80;
    server_name api.zaytcev-net.nomorepartiessite.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: фронтенд
server {
    listen 443 ssl;
    server_name film.zaytcev-net.nomorepartiessite.ru;

    ssl_certificate /etc/letsencrypt/live/film.zaytcev-net.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/film.zaytcev-net.nomorepartiessite.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS: API и статические файлы
server {
    listen 443 ssl;
    server_name api.zaytcev-net.nomorepartiessite.ru;

    ssl_certificate /etc/letsencrypt/live/film.zaytcev-net.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/film.zaytcev-net.nomorepartiessite.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://backend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /content/ {
        proxy_pass http://backend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
