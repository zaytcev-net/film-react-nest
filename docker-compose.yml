services:
  # PostgreSQL
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-afisha}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-afisha}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: film-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: database
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-afisha}
      DATABASE_PORT: 5432
      LOGGER_TYPE: ${LOGGER_TYPE:-dev}
    depends_on:
      database:
        condition: service_healthy

  # React frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: film-frontend
    volumes:
      - frontend_data:/frontend

  # Nginx
  server:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: film-server
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_data:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  frontend_data: